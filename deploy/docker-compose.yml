# Agent Console on the shared VPS. Own project, own network, localhost-only port.
name: agent-console
services:
  agent-console:
    build:
      context: ..
      dockerfile: Dockerfile
    image: agent-console:latest
    container_name: agent-console
    restart: unless-stopped
    env_file: /opt/agent-framework/app.env
    environment:
      SKILLWARE_URL: http://skillware-runner:8080
    volumes:
      - /opt/agent-framework/data:/data
    ports:
      - "127.0.0.1:3300:3000"
    networks:
      - agent-console-net
      - skillware-net
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  # Real Skillware skills (Python). Private: no host port; only the console can reach it
  # (its own network, which nginx and the other sites are not on). Reads SKILLWARE_TOKEN.
  skillware-runner:
    build:
      context: ..
      dockerfile: skillware-runner/Dockerfile
    image: skillware-runner:latest
    container_name: skillware-runner
    restart: unless-stopped
    env_file: /opt/agent-framework/app.env
    networks:
      - skillware-net
    mem_limit: 1g
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - skillware-models:/opt/models
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  agent-console-net:
    name: agent-console-net
  skillware-net:
    name: skillware-net
volumes:
  skillware-models:
