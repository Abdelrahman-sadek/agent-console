# agent-console.higher-institute.tech → agent-console container (Agent Console).
# Installed by /opt/agent-framework (deploy/steps/publish-site.sh) into the shared edge
# (/opt/edge-nginx/etc-nginx/conf.d). Remove with that project's uninstall step.
#
# The upstream is resolved at request time (resolver + variable), so nginx starts and
# reloads even if the agent-console container is stopped: only this host returns 502.

server {
    listen 80;
    server_name agent-console.higher-institute.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agent-console.higher-institute.tech;

    ssl_certificate     /etc/nginx/certs-agent-console/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs-agent-console/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 1m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $agent_console_upstream http://agent-console:3000;

    location / {
        proxy_pass         $agent_console_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection "";
        # Live run events are Server-Sent Events: no buffering, long reads.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }
}
