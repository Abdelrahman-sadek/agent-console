# ── Agent Console (agent-console.higher-institute.tech) ─────────────────────
# Separate project: github.com/Abdelrahman-sadek/agent-console, container
# `agent-console` on tayyibt_tayyibt-network, installed under /opt/agent-framework.
# Certificate: /opt/tayyibt/certs/agent-console/ (certs/ is excluded from the
# deploy rsync), issued and renewed by that project via DNS-01.
# The upstream is resolved at request time (resolver + variable), so `nginx -t`
# and nginx start/reload never depend on that container: if it is down, only
# this host returns 502 and no other site is affected.
server {
    listen 443 ssl http2;
    server_name agent-console.higher-institute.tech;

    ssl_certificate     /etc/nginx/certs/agent-console/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/agent-console/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $agent_console_upstream http://agent-console:3000;

    location / {
        proxy_pass         $agent_console_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection "";
        # Live run events are Server-Sent Events: no buffering, long reads.
        proxy_buffering    off;
        proxy_read_timeout 1h;
    }
}
