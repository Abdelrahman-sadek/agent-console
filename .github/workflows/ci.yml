name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build agents-framework (submodule)
        run: |
          pnpm -C vendor/agents-framework install --frozen-lockfile
          pnpm -C vendor/agents-framework build
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
